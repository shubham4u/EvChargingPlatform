server:
  servlet:
    encoding:
      # Say "charset=UTF-8" explicitly. JSON is UTF-8 by spec, but some clients (Windows PowerShell 5.1)
      # otherwise decode it as Latin-1 and show "£" as "Â£".
      charset: UTF-8
      force-response: true

spring:
  application:
    name: station-service
  cloud:
    config:
      enabled: ${SPRING_CLOUD_CONFIG_ENABLED:false}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ev_charging}
    username: ${DB_USERNAME:ev_charging}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 10m
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must be issued by this realm, for this API. Keys come from jwk-set-uri, which in
          # Docker is the internal keycloak:8080 address while the issuer stays the browser-facing URL.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/ev-charging}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/ev-charging/protocol/openid-connect/certs}
          audiences: ${OIDC_AUDIENCE:ev-platform-api}
  kafka:
    # Propagate the trace (W3C traceparent header) from the API request into every event and listener,
    # so the audit can link an event to the request that caused it.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: ${KAFKA_PRODUCER_ACKS:all}
      retries: ${KAFKA_PRODUCER_RETRIES:5}
      properties:
        enable.idempotence: ${KAFKA_PRODUCER_IDEMPOTENCE:true}
        compression.type: ${KAFKA_PRODUCER_COMPRESSION:lz4}
        batch.size: ${KAFKA_PRODUCER_BATCH_SIZE:16384}
        linger.ms: ${KAFKA_PRODUCER_LINGER_MS:5}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:station-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "org.evchargingplatform.events.*"

app:
  messaging:
    enabled: ${KAFKA_ENABLED:false}
    station-topic: ${STATION_EVENTS_TOPIC:station.events.v1}
    reservation-topic: ${RESERVATION_EVENTS_TOPIC:reservation.events.v1}
    charging-events-topic: ${CHARGING_EVENTS_TOPIC:charging.events.v1}
    user-events-topic: ${USER_EVENTS_TOPIC:user.events.v1}
    vehicle-events-topic: ${VEHICLE_EVENTS_TOPIC:vehicle.events.v1}
    payment-events-topic: ${PAYMENT_EVENTS_TOPIC:payment.events.v1}
    consumer-group: ${KAFKA_CONSUMER_GROUP:station-service}
  payments:
    # Held on the driver's card when charging starts, in the station tariff's currency; the real cost is
    # captured on stop. A session costing more than this ends PAYMENT_FAILED (no incremental authorization yet).
    hold-amount: ${PAYMENT_HOLD_AMOUNT:50.00}
  # Bound by station/infrastructure/kafka/KafkaProperties: topics created at startup and the station publisher's topic.
  kafka:
    station-topic: ${STATION_EVENTS_TOPIC:station.events.v1}
    charger-topic: ${CHARGER_EVENTS_TOPIC:charger.events.v1}
    telemetry-topic: ${TELEMETRY_EVENTS_TOPIC:telemetry.events.v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}