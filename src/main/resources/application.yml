spring:
  application:
    name: station-service
  cloud:
    config:
      enabled: ${SPRING_CLOUD_CONFIG_ENABLED:false}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ev_charging}
    username: ${DB_USERNAME:ev_charging}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 10m
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: ${KAFKA_PRODUCER_ACKS:all}
      retries: ${KAFKA_PRODUCER_RETRIES:5}
      properties:
        enable.idempotence: ${KAFKA_PRODUCER_IDEMPOTENCE:true}
        compression.type: ${KAFKA_PRODUCER_COMPRESSION:lz4}
        batch.size: ${KAFKA_PRODUCER_BATCH_SIZE:16384}
        linger.ms: ${KAFKA_PRODUCER_LINGER_MS:5}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:station-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "org.evchargingplatform.events.*"

app:
  messaging:
    enabled: ${KAFKA_ENABLED:false}
    station-topic: ${STATION_EVENTS_TOPIC:station.events.v1}
    reservation-topic: ${RESERVATION_EVENTS_TOPIC:reservation.events.v1}
    consumer-group: ${KAFKA_CONSUMER_GROUP:station-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}