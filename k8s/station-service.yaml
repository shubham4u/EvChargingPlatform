apiVersion: v1
kind: ConfigMap
metadata:
  name: station-service-config
data:
  DB_URL: jdbc:postgresql://postgresql:5432/ev_charging
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
apiVersion: apps/v1
kind: Deployment
metadata:
  name: station-service
  labels:
    app.kubernetes.io/name: station-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: station-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: station-service
    spec:
      containers:
        - name: station-service
          image: ghcr.io/your-org/station-service:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: station-service-config
            - secretRef:
                name: station-service-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: station-service
spec:
  selector:
    app.kubernetes.io/name: station-service
  ports:
    - port: 80
      targetPort: 8080
