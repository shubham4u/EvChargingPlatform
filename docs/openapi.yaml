openapi: 3.0.3
info:
  title: EV Charging Network Platform API
  version: 1.0.0
servers:
  - url: /api
paths:
  /stations:
    post:
      summary: Create a station
      operationId: createStation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationResponse'
    get:
      summary: List stations
      operationId: listStations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StationResponse'
  /stations/{id}:
    get:
      summary: Get a station
      operationId: getStation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationResponse'
  /reservations:
    post:
      summary: Create a reservation
      operationId: createReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
  /reservations/{id}:
    get:
      summary: Get a reservation
      operationId: getReservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
  /charging/sessions:
    post:
      summary: Start a charging session
      operationId: startChargingSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartChargingRequest'
      responses:
        '201':
          description: Created (session is ACTIVE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargingSessionResponse'
        '400':
          description: Validation failed
        '409':
          description: Connector not reserved for the given reservation, connector and user
    get:
      summary: List charging sessions
      operationId: listChargingSessions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChargingSessionResponse'
  /charging/sessions/{id}:
    get:
      summary: Get a charging session
      operationId: getChargingSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargingSessionResponse'
        '404':
          description: Charging session not found
  /charging/sessions/{id}/stop:
    patch:
      summary: Stop a charging session
      operationId: stopChargingSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopChargingRequest'
      responses:
        '200':
          description: OK (session is STOPPED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargingSessionResponse'
        '400':
          description: Validation failed
        '404':
          description: Charging session not found
        '409':
          description: Invalid state transition (session is not ACTIVE)
components:
  schemas:
    CreateStationRequest:
      type: object
      required: [externalRef, name, countryCode, latitude, longitude]
      properties:
        externalRef:
          type: string
        name:
          type: string
        countryCode:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    StationResponse:
      type: object
      properties:
        stationId:
          type: string
          format: uuid
        externalRef:
          type: string
        name:
          type: string
        countryCode:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        status:
          type: string
    CreateReservationRequest:
      type: object
      required: [stationId, connectorId, userId, expiresAt]
      properties:
        stationId:
          type: string
          format: uuid
        connectorId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    ReservationResponse:
      type: object
      properties:
        reservationId:
          type: string
          format: uuid
        stationId:
          type: string
          format: uuid
        connectorId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
        expiresAt:
          type: string
          format: date-time
    StartChargingRequest:
      type: object
      required: [stationId, connectorId, userId, vehicleId]
      properties:
        stationId:
          type: string
          format: uuid
        connectorId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        reservationId:
          type: string
          format: uuid
          nullable: true
          description: Omit for walk-up charging.
    StopChargingRequest:
      type: object
      required: [totalEnergyKwh]
      properties:
        totalEnergyKwh:
          type: number
    ChargingSessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        chargingSessionNumber:
          type: string
        stationId:
          type: string
          format: uuid
        connectorId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        reservationId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [REQUESTED, ACTIVE, STOPPED]
        startedAt:
          type: string
          format: date-time
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        totalEnergyKwh:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
