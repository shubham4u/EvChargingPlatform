openapi: 3.0.3
info:
  title: EV Charging Network Platform API
  version: 1.1.0
  description: >
    Driver journey: register a user, register their EV, find a station's connectors,
    optionally reserve one, start and stop a charging session. Errors are RFC 7807
    problem details (see ProblemDetail).

    Authentication: send a Keycloak access token from realm ev-charging as
    `Authorization: Bearer <token>`. The caller's user id is the token's `sub`; requests
    never carry a userId. Drivers can only see and change their own resources;
    operators (realm role `operator`) can see and act on everyone's and manage stations.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /users/me:
    post:
      summary: Create your profile from your login
      description: >
        Call once after signing up in Keycloak. The profile's id and email come from the token;
        the body is optional and displayName defaults to the name on the account.
      operationId: registerMe
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation failed, or the account has no email address
        '409':
          description: A profile already exists for this account, or the email is taken
    get:
      summary: Get your profile
      operationId: getMe
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: No profile yet (call POST /users/me)
  /users:
    get:
      summary: List users (operator)
      operationId: listUsers
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
  /users/{id}:
    get:
      summary: Get a user
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
  /vehicles:
    post:
      summary: Register an EV to yourself
      operationId: registerVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterVehicleRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: You have no profile yet (call POST /users/me)
        '409':
          description: Vehicle already registered (VIN)
    get:
      summary: List your vehicles (operators see all, optionally filtered by owner)
      operationId: listVehicles
      parameters:
        - name: ownerUserId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleResponse'
        '404':
          description: Owner user not found
  /vehicles/{id}:
    get:
      summary: Get a vehicle
      operationId: getVehicle
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '404':
          description: Vehicle not found
  /stations:
    post:
      summary: Create a station (operator)
      operationId: createStation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStationRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: Station already exists (externalReference)
    get:
      summary: List stations
      operationId: listStations
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StationResponse'
  /stations/search:
    get:
      summary: Find stations near a point, by connector type, power and live availability
      description: >
        Public. Every parameter is optional; lat and lng go together. Connector filters apply per
        connector: a station matches when one of its connectors meets all of them, and only matching
        connectors are listed. Nearest first with a location, otherwise by name. Availability comes
        from the station read models, so it can trail a session start/stop by a fraction of a second.
      operationId: searchStations
      security: []
      parameters:
        - name: lat
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radiusKm
          in: query
          schema: { type: number, default: 10, exclusiveMinimum: true, minimum: 0, maximum: 200 }
        - name: connectorType
          in: query
          schema:
            $ref: '#/components/schemas/ConnectorType'
        - name: minPowerKw
          in: query
          schema: { type: integer, minimum: 1 }
        - name: available
          in: query
          description: Only connectors that are AVAILABLE right now
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StationSearchResponse'
        '400':
          description: Invalid parameter (e.g. lat without lng, unknown connectorType, radius over 200 km)
  /stations/{id}:
    get:
      summary: Get a station
      operationId: getStation
      parameters:
        - $ref: '#/components/parameters/Id'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationResponse'
        '404':
          description: Station not found
  /stations/{id}/connectors:
    post:
      summary: Add a connector to a station (operator)
      operationId: addConnector
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConnectorRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: Station not found
    get:
      summary: List a station's connectors with live status
      operationId: listConnectors
      parameters:
        - $ref: '#/components/parameters/Id'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectorResponse'
        '404':
          description: Station not found
  /stations/{id}/tariff:
    get:
      summary: Current prices at a station
      operationId: getTariff
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        '404':
          description: The station has no tariff yet
    put:
      summary: Set a station's prices (operator). Creates a new version; running sessions keep theirs.
      operationId: setTariff
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: Station not found
  /payments/methods/me:
    put:
      summary: Save your card (a provider token, never a card number)
      operationId: setPaymentMethod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Simulated provider tokens are tok_visa, tok_mastercard, tok_chargeDeclined and tok_captureFails
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodResponse'
        '400':
          description: Unknown card token
    get:
      summary: Your saved card
      operationId: getPaymentMethod
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodResponse'
        '404':
          description: No saved card
  /payments:
    get:
      summary: Your payments (operators see all)
      operationId: listPayments
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'
  /payments/{id}:
    get:
      summary: Get a payment
      operationId: getPayment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          description: Payment not found
  /payments/{id}/refund:
    post:
      summary: Refund a captured payment in full (operator)
      operationId: refundPayment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK (status REFUNDED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          description: Payment not found
        '409':
          description: The payment is not CAPTURED
  /notifications:
    get:
      summary: Your notification inbox, newest first
      operationId: listNotifications
      parameters:
        - name: unread
          in: query
          schema: { type: boolean, default: false }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'
  /notifications/{id}/read:
    patch:
      summary: Mark one of your notifications read
      operationId: markNotificationRead
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '404':
          description: Notification not found
  /audit/events:
    get:
      summary: Domain event history (operator), oldest first
      operationId: listAuditEvents
      parameters:
        - name: key
          in: query
          description: The aggregate the event is about, e.g. a session or reservation id
          schema: { type: string }
        - name: type
          in: query
          description: Event type, e.g. ChargingSessionStartedEvent
          schema: { type: string }
        - name: traceId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventResponse'
  /reports/stations/{id}:
    get:
      summary: Station usage and money over a period (operator)
      operationId: stationReport
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: from
          in: query
          description: Defaults to 30 days before `to`
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Defaults to now
          schema: { type: string, format: date-time }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationReport'
        '400':
          description: from is not before to
        '404':
          description: Station not found
  /reservations:
    post:
      summary: Create a reservation
      operationId: createReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          description: Validation failed, or startTime is in the past
        '404':
          description: User not found, or connector not found at the station
        '409':
          description: Vehicle not owned by user, or connector already reserved for an overlapping window
    get:
      summary: List your reservations (operators see all)
      operationId: listReservations
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationResponse'
  /reservations/{id}:
    get:
      summary: Get a reservation
      operationId: getReservation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '404':
          description: Reservation not found
  /reservations/{id}/cancel:
    patch:
      summary: Cancel a reservation
      operationId: cancelReservation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '404':
          description: Reservation not found
        '409':
          description: Reservation is already terminal
  /reservations/{id}/complete:
    patch:
      summary: Complete an active reservation
      operationId: completeReservation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '404':
          description: Reservation not found
        '409':
          description: Only ACTIVE reservations can complete
  /charging/sessions:
    post:
      summary: Start a charging session
      operationId: startChargingSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartChargingRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Created (session is ACTIVE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargingSessionResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '402':
          description: No saved card, or the hold on it was declined (body has failureCode)
        '404':
          description: User, vehicle, or connector at the station not found; or the station has no tariff
        '409':
          description: >
            Vehicle not owned by user; connector in use (active session, or held by another
            reservation); vehicle already charging; or connector not reserved for the given reservation
    get:
      summary: List your charging sessions (operators see all)
      operationId: listChargingSessions
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChargingSessionResponse'
  /charging/sessions/{id}:
    get:
      summary: Get a charging session
      operationId: getChargingSession
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargingSessionResponse'
        '404':
          description: Charging session not found
  /charging/sessions/{id}/stop:
    patch:
      summary: Stop a charging session
      operationId: stopChargingSession
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopChargingRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK. Session is STOPPED and paid, or PAYMENT_FAILED when the final charge could not be taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargingSessionResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: Charging session not found
        '409':
          description: Invalid state transition (session is not ACTIVE)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from Keycloak realm ev-charging, audience ev-platform-api.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing, expired or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Authenticated, but not allowed (wrong role, or not your resource)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationFailed:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    RegisterUserRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        phoneNumber:
          type: string
          maxLength: 30
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        role:
          type: string
          enum: [DRIVER]
        createdAt:
          type: string
          format: date-time
    RegisterVehicleRequest:
      type: object
      required: [vin, make, model]
      properties:
        vin:
          type: string
          pattern: '^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$'
        make:
          type: string
          maxLength: 50
        model:
          type: string
          maxLength: 50
    VehicleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        vin:
          type: string
        make:
          type: string
        model:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateStationRequest:
      type: object
      required: [externalReference, name]
      properties:
        externalReference:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 200
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    StationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReference:
          type: string
        name:
          type: string
        countryCode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        status:
          type: string
          enum: [ACTIVE, INACTIVE, MAINTENANCE]
        createdAt:
          type: string
          format: date-time
    AddConnectorRequest:
      type: object
      required: [connectorType, maxPowerKw]
      properties:
        connectorType:
          $ref: '#/components/schemas/ConnectorType'
        maxPowerKw:
          type: integer
          minimum: 1
          maximum: 1000
    ConnectorResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stationId:
          type: string
          format: uuid
        connectorType:
          $ref: '#/components/schemas/ConnectorType'
        maxPowerKw:
          type: integer
        status:
          type: string
          enum: [AVAILABLE, RESERVED, OCCUPIED]
          description: OCCUPIED (a session is running) wins over RESERVED (an unexpired reservation holds it)
        createdAt:
          type: string
          format: date-time
    StationSearchResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReference:
          type: string
        name:
          type: string
        countryCode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        status:
          type: string
        distanceKm:
          type: number
          nullable: true
          description: From the search point; null without lat/lng
        availableConnectors:
          type: integer
          description: How many of the listed connectors are AVAILABLE
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorResponse'
    NotificationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [RESERVATION_CONFIRMED, RESERVATION_CANCELLED, RESERVATION_EXPIRED, CHARGING_STARTED, CHARGING_FINISHED, PAYMENT_RECEIVED, PAYMENT_DECLINED, PAYMENT_FAILED, REFUND_ISSUED]
        title: { type: string }
        body: { type: string }
        subjectId: { type: string, format: uuid, nullable: true, description: The session, reservation or payment it is about }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
    AuditEventResponse:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        topic: { type: string }
        key: { type: string }
        occurredAt: { type: string, format: date-time }
        traceId: { type: string, nullable: true, description: W3C trace id; open in the tracing UI to see the request }
        payload: { type: object, description: The event exactly as published }
    StationReport:
      type: object
      properties:
        stationId: { type: string, format: uuid }
        stationName: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        sessions: { type: integer }
        activeSessions: { type: integer }
        paidSessions: { type: integer }
        paymentFailures: { type: integer }
        energyKwh: { type: number }
        billed: { type: number }
        revenue: { type: number, description: Captured minus refunded }
        refunded: { type: number }
        outstanding: { type: number, description: Cost of PAYMENT_FAILED sessions }
        currency: { type: string, nullable: true }
    ConnectorType:
      type: string
      enum: [TYPE2, CCS2, CHADEMO, CCS1, NACS]
    CreateReservationRequest:
      type: object
      required: [stationId, chargerId, vehicleId, startTime]
      properties:
        stationId:
          type: string
          format: uuid
        chargerId:
          type: string
          format: uuid
          description: Connector id at the station.
        vehicleId:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
          description: Must be in the future. The hold lasts 10 minutes from startTime.
    ReservationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reservationNumber:
          type: string
        stationId:
          type: string
          format: uuid
        chargerId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
        expirationTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [CREATED, ACTIVE, CANCELLED, COMPLETED, EXPIRED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StartChargingRequest:
      type: object
      required: [stationId, connectorId, vehicleId]
      properties:
        stationId:
          type: string
          format: uuid
        connectorId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        reservationId:
          type: string
          format: uuid
          nullable: true
          description: Omit for walk-up charging.
    StopChargingRequest:
      type: object
      required: [totalEnergyKwh]
      properties:
        totalEnergyKwh:
          type: number
    ChargingSessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        chargingSessionNumber:
          type: string
        stationId:
          type: string
          format: uuid
        connectorId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        reservationId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [REQUESTED, ACTIVE, STOPPED, PAYMENT_FAILED]
        startedAt:
          type: string
          format: date-time
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        totalEnergyKwh:
          type: number
          nullable: true
        tariffId:
          type: string
          format: uuid
          nullable: true
          description: The tariff in force when the session started; it is billed at this one
        totalCost:
          type: number
          nullable: true
          description: Set when the session stops, including when payment then fails
        currency:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TariffRequest:
      type: object
      required: [currency, pricePerKwh, pricePerMinute, sessionFee]
      properties:
        currency:
          type: string
          description: ISO 4217 code, e.g. GBP
        pricePerKwh:
          type: number
          minimum: 0
          maximum: 100
        pricePerMinute:
          type: number
          minimum: 0
          maximum: 100
        sessionFee:
          type: number
          minimum: 0
          maximum: 1000
    TariffResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stationId:
          type: string
          format: uuid
        currency:
          type: string
        pricePerKwh:
          type: number
        pricePerMinute:
          type: number
        sessionFee:
          type: number
        createdAt:
          type: string
          format: date-time
    PaymentMethodResponse:
      type: object
      properties:
        brand:
          type: string
        last4:
          type: string
        updatedAt:
          type: string
          format: date-time
    PaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [AUTHORIZED, CAPTURED, REFUNDED, FAILED]
        currency:
          type: string
        authorizedAmount:
          type: number
        capturedAmount:
          type: number
          nullable: true
        cardBrand:
          type: string
        cardLast4:
          type: string
        failureCode:
          type: string
          nullable: true
          description: e.g. card_declined, capture_failed, amount_exceeds_authorization
        failureReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
